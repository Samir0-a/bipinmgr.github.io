<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bipin Magar</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
scroll-behavior:smooth;
}

body{
background: linear-gradient(135deg,#0f0f0f,#1a1a1a);
color:white;
overflow-x:hidden;
}

/* Navigation */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 10%;
background:#111;
position:fixed;
width:100%;
z-index:1000;
box-shadow:0 0 15px #00f7ff;
}

nav h1{
color:#00f7ff;
}

nav ul{
list-style:none;
display:flex;
gap:20px;
}

nav ul li a{
text-decoration:none;
color:white;
transition:0.3s;
}

nav ul li a:hover{
color:#00f7ff;
}

/* Hero Section */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#111 30%,#000 100%);
}

.hero h2{
font-size:50px;
color:#00f7ff;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 10px #00f7ff;}
to{ text-shadow:0 0 25px #00f7ff;}
}

.hero button{
margin-top:20px;
padding:12px 25px;
border:none;
background:#00f7ff;
color:black;
font-weight:bold;
cursor:pointer;
border-radius:5px;
transition:0.3s;
}

.hero button:hover{
transform:scale(1.1);
}

/* Videos */
.section{
padding:80px 10%;
text-align:center;
}

.video-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-top:30px;
}

iframe{
width:100%;
height:200px;
border-radius:10px;
}

/* Subscriber Counter */
.counter{
font-size:40px;
color:#00f7ff;
margin-top:20px;
}

/* Contact */
form{
max-width:500px;
margin:30px auto;
display:flex;
flex-direction:column;
gap:15px;
}

input,textarea{
padding:10px;
border:none;
border-radius:5px;
}

form button{
background:#00f7ff;
border:none;
padding:10px;
cursor:pointer;
font-weight:bold;
}

/* Footer */
footer{
background:#111;
padding:20px;
text-align:center;
margin-top:50px;
}
.yt-btn{
display:inline-block;
margin-top:15px;
padding:12px 25px;
background:#ff0000;
color:white;
text-decoration:none;
border-radius:5px;
font-weight:bold;
transition:0.3s;
box-shadow:0 0 15px #ff0000;
}

.yt-btn:hover{
background:#cc0000;
transform:scale(1.1);
box-shadow:0 0 25px #ff0000;
}
</style>
</head>

<body>

<nav>
<h1>Bipin Mgr</h1>
<ul>
<li><a href="#home">Home</a></li>
<li><a href="#videos">Videos</a></li>
<li><a href="https://www.youtube.com/@bipinmgr7" target="_blank">YouTube</a></li>
</ul>
</nav>

<section class="hero" id="home">
<h2>Welcome To BipinMgr</h2>
<p>🔥 Android Gaming | Live Streams | Pro Gameplay 🔥</p>

<button onclick="scrollToVideos()">Watch Now</button>

<br>

<div style="margin-top:20px;">
<div class="g-ytsubscribe"
data-channel="bipinmgr7"
data-layout="full"
data-theme="dark"
data-count="default">
</div>
</div>

<div class="counter" id="subCount">Subscribers: 0</div>
</section>

<section class="section" id="videos">
<h2>🔥 Latest Videos</h2>
<div class="video-container">

<iframe src="https://www.youtube.com/embed/0bIpd64kdXM"
allowfullscreen></iframe>

<iframe src="https://www.youtube.com/embed/6KytcYHTX9k"
allowfullscreen></iframe>

<iframe src="https://www.youtube.com/embed/S0k3mXk3ClE"
allowfullscreen></iframe>

</div>
</section>

<footer>
© 2026 Bipin Mgr | All Rights Reserved
</footer>

<script src="https://apis.google.com/js/platform.js"></script>

<script>
function scrollToVideos(){
document.getElementById("videos").scrollIntoView();
}

let count=0;
let target=5670;
let sub=document.getElementById("subCount");

let interval=setInterval(()=>{
count+=50;
sub.innerText="Subscribers: "+count;
if(count>=target){
clearInterval(interval);
}
},30);
</script>

</body>
</html>
